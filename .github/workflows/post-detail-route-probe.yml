name: Post Detail Route Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-post-detail-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run post module guard
        run: npm run test:post-module

      - name: Run post main-chain guard
        run: npm run test:post-main-chain

      - name: Run post detail route guard
        run: npm run test:post-detail-route

      - name: Run post detail route probe
        run: npm run migrate:post-detail-route

      - name: Generate post main-chain audit report
        run: npm run audit:post-main-chain

      - name: Validate post detail route probe output
        run: npm run test:post-detail-probe-output

      - name: Generate post detail migration readiness report
        run: npm run audit:post-detail-readiness

      - name: Upload post reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-detail-route-probe-reports
          path: |
            artifacts/post-main-chain-audit.md
            artifacts/post-detail-route-probe.md
            artifacts/post-detail-route-probe.json
            artifacts/post-detail-route-readiness.md
            artifacts/post-detail-route-readiness.json
