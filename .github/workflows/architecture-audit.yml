name: Architecture Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  architecture-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run architecture audit
        run: npm run audit:architecture

      - name: Generate architecture debt report
        if: always()
        run: npm run audit:report

      - name: Upload architecture debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: artifacts/architecture-report.md
