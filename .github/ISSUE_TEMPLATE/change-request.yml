name: 需求变更单
description: 优化或新功能的统一入口（老板可读）
title: "[CHANGE] "
labels:
  - change-request
body:
  - type: dropdown
    id: work_type
    attributes:
      label: 变更类型
      description: 二选一
      options:
        - 优化（不改业务逻辑）
        - 新功能（会改业务逻辑/数据）
    validations:
      required: true

  - type: textarea
    id: business_goal
    attributes:
      label: 业务目标
      description: 这次要解决什么问题
      placeholder: 示例：提升信息流加载速度，降低用户流失
    validations:
      required: true

  - type: textarea
    id: user_story
    attributes:
      label: 用户场景
      description: 谁在什么场景下需要这个能力
      placeholder: 作为 xx 用户，我希望...，这样我可以...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 验收标准
      description: 必须可判断通过/不通过
      placeholder: |
        1) ...
        2) ...
        3) ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 受影响端和模块
      placeholder: PC / H5 / API / Telegram / 管理端 / 数据库
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: 风险说明
      description: 主要业务风险与数据风险
      placeholder: 行为变化风险、迁移风险、兼容风险等
    validations:
      required: true

  - type: textarea
    id: rollout
    attributes:
      label: 发布与回滚
      description: 简要说明怎么发、什么情况回滚、回滚影响
      placeholder: 先灰度后全量；出现 xx 指标异常则回滚...
    validations:
      required: true
