name: 上线评审单（老板版）
description: 合并/上线前的业务评审（不看代码）
title: "[REVIEW] "
labels:
  - release-review
body:
  - type: input
    id: linked_issue
    attributes:
      label: 关联需求单
      description: 填写需求变更单链接或编号
      placeholder: 例如 #12
    validations:
      required: true

  - type: dropdown
    id: work_type
    attributes:
      label: 变更类型
      options:
        - 优化（不改业务逻辑）
        - 新功能（会改业务逻辑/数据）
    validations:
      required: true

  - type: textarea
    id: what_changed
    attributes:
      label: 1) 这次做了什么
      description: 用业务语言写 1-3 句话
    validations:
      required: true

  - type: textarea
    id: user_visible
    attributes:
      label: 2) 用户会看到什么变化
      description: 页面或流程的变化点
    validations:
      required: true

  - type: checkboxes
    id: acceptance
    attributes:
      label: 3) 需求是否达标
      options:
        - label: 达成需求目标
          required: true
        - label: 达成验收标准
          required: true
        - label: 优化场景下行为无漂移（仅优化）
          required: false
        - label: 数据/流程改动已确认可接受（仅新功能）
          required: false

  - type: textarea
    id: risk_impact
    attributes:
      label: 4) 风险与影响
      description: 影响范围、核心风险、缓解手段
    validations:
      required: true

  - type: textarea
    id: release_rollback
    attributes:
      label: 5) 上线与回滚
      description: 上线步骤、回滚触发条件、回滚路径
    validations:
      required: true

  - type: textarea
    id: decision_request
    attributes:
      label: 6) 请老板决策（一句话）
      description: 固定格式
      placeholder: 通过上线 / 退回修改：原因...
    validations:
      required: true
